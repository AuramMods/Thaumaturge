name: Build Forge 1.20.1
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1 libgl1-mesa-dri
      - name: Generate data
        run: ./gradlew runData
      - name: Test and build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -PportHiddenWindow -PportIntegrations build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-test-results
          path: build/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: thaumaturge-forge-1.20.1
          path: build/libs/thaumaturge-*-mc1.20.1-forge.jar
          if-no-files-found: error
