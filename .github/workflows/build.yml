name: Build Forge 1.20.1
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate data
        run: ./gradlew runData
      - name: Test and build
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: thaumaturge-forge-1.20.1
          path: build/libs/thaumaturge-*-mc1.20.1-forge.jar
          if-no-files-found: error
