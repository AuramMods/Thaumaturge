    backgroundSmokeRuntimeOnly 'org.lwjgl:lwjgl:3.3.1:natives-macos-arm64'
    backgroundSmokeRuntimeOnly 'org.lwjgl:lwjgl-glfw:3.3.1:natives-macos-arm64'

    portCodecTestImplementation platform('org.junit:junit-bom:5.11.4')
    portCodecTestImplementation 'org.junit.jupiter:junit-jupiter'
    portCodecTestImplementation 'org.mockito:mockito-core:5.15.2'
    portCodecTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    portDfuReferenceImplementation 'com.mojang:datafixerupper:8.0.16'
    portDfuReferenceImplementation 'com.google.code.gson:gson:2.10.1'
    portDfuReferenceImplementation 'com.google.guava:guava:32.1.2-jre'
    portDfuReferenceRuntimeOnly 'it.unimi.dsi:fastutil:8.5.12'
    portDfuReferenceRuntimeOnly 'org.joml:joml:1.10.5'
    portDfuReferenceRuntimeOnly 'org.apache.commons:commons-lang3:3.14.0'
    portDfuReferenceRuntimeOnly 'com.mojang:authlib:6.0.54'
    portDfuReferenceRuntimeOnly 'com.mojang:logging:1.2.7'
    portDfuReferenceRuntimeOnly 'org.slf4j:slf4j-api:2.0.9'

    // Run with -PportIntegrations to exercise JEI, Jade and Dynamic Trees integration.
    if (providers.gradleProperty('portIntegrations').isPresent()) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
        runtimeOnly fg.deobf("maven.modrinth:jade:${jade_version}")
        runtimeOnly fg.deobf("maven.modrinth:vdjF5PL5:${dynamic_trees_version}")
    }
    if (providers.gradleProperty('portScriptIntegrations').isPresent()) {
