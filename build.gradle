tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', providers.gradleProperty('portMaxErrors').getOrElse('2000')])
}

tasks.named('compileJava', JavaCompile) { compile ->
    // MixinGradle writes these files outside javac's classes directory.
    // Cache them with the classes so jar packaging and reobfuscation can reuse them.
    outputs.file(providers.provider { compile.ext.refMapFile }).withPropertyName('mixinRefmap')
    outputs.file(providers.provider { compile.ext.outTsrgFile }).withPropertyName('mixinMappings')
    outputs.file(providers.provider { new File(compile.temporaryDir, compile.ext.refMap) })
            .withPropertyName('packagedMixinRefmap')
    inputs.file(layout.buildDirectory.file('createMcpToSrg/output.tsrg'))
            .withPropertyName('mixinInputMappings').withPathSensitivity(PathSensitivity.NONE)
    if (providers.gradleProperty('portCommandLineCompiler').isPresent()) {
        // External javac reports its exit status without serializing thousands
        // of Compiler API diagnostics back through the Gradle client.
        options.fork = true
        options.forkOptions.executable = javaCompiler.get().executablePath.asFile.absolutePath
        options.forkOptions.memoryMaximumSize = '4G'
        options.compilerArgs.add('-XDdev')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'thaumaturge.testResourceRoot', file('src/main/resources').absolutePath
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.tags('apiNote:a:API Note:', 'implNote:a:Implementation Note:')
}

tasks.named('compilePortMixinsJava', JavaCompile) {
    def mappings = layout.buildDirectory.file('createMcpToSrg/output.tsrg')
    def refmap = layout.buildDirectory.file('port-mixins.refmap.json')
    dependsOn 'createMcpToSrg'
    inputs.file(mappings).withPropertyName('mixinInputMappings').withPathSensitivity(PathSensitivity.NONE)
    outputs.file(refmap).withPropertyName('mixinRefmap')
    options.compilerArgs.addAll([
            "-AreobfTsrgFile=${mappings.get().asFile}",
            "-AoutRefMapFile=${refmap.get().asFile}",
            '-AmappingTypes=tsrg', '-AdefaultObfuscationEnv=searge'])
}

tasks.register('portCodecTest', Test) {
    testClassesDirs = sourceSets.portCodecTest.output.classesDirs
    classpath = sourceSets.portCodecTest.runtimeClasspath
    // A failed vanilla bootstrap sets its global flag before throwing. Keep
    // that partial initialization from making later test classes appear valid.
    forkEvery = 1
}

