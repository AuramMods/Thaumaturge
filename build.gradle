plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = "${mod_version}-mc${minecraft_version}-forge"
group = mod_group_id
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
    withJavadocJar()
}

jarJar.enable()

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {
            workingDirectory project.file('run/client')
        }
        server {
            workingDirectory project.file('run/server')
            args '--nogui'
        }
        gameTestServer {
            workingDirectory project.file('run-gametest')
        }
        data {
            workingDirectory project.file('run/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources'), '--existing', file('src/main/resources')
        }
    }
}

mixin {
    add sourceSets.main, 'thaumaturge.refmap.json'
    config 'thaumaturge.mixins.json'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}
sourceSets.test.java.srcDir 'porting/testing/dfu-reference/java'

// Separate source sets let the window controls be tested before the mod compiles.
// Neither the agent nor its dependencies enter the distributable mod JAR.
sourceSets {
    backgroundAgent { java.srcDir 'porting/testing/java' }
    backgroundSmoke { java.srcDir 'porting/testing/smoke' }
    // Compile the actual production codecs in isolation while the other APIs
    // are ported. They also remain in the full main build and normal test suite.
