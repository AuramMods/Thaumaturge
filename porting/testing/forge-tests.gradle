// Focused native-loader tests. Normal main compilation and release runs retain
// the entire mod; this does not produce a Thaumaturge distributable.
sourceSets {
    portLauncher {
        java.srcDir 'porting/testing/forge-launcher/java'
        resources.srcDir 'porting/testing/forge-launcher/resources'
        compileClasspath += sourceSets.main.compileClasspath
    }
    portRuntime {
        java.srcDir 'porting/testing/forge-runtime/java'
        compileClasspath += sourceSets.portCodecTest.compileClasspath
        runtimeClasspath += sourceSets.portCodecTest.runtimeClasspath
    }
}

dependencies {
    portRuntimeImplementation platform('org.junit:junit-bom:5.11.4')
    portRuntimeImplementation 'org.junit.platform:junit-platform-launcher'
    portRuntimeImplementation 'org.junit.platform:junit-platform-reporting'
    portRuntimeImplementation 'org.junit.jupiter:junit-jupiter-engine'
}

def launcherJar = tasks.register('portLauncherJar', Zip) {
    archiveFileName = 'thaumaturge-port-launcher.jar'
    destinationDirectory = layout.buildDirectory.dir('port-testing')
    from sourceSets.portLauncher.output
}

def runtimeJar = tasks.register('portTestRuntimeJar', Zip) {
    archiveFileName = 'thaumaturge-port-tests.jar'
    destinationDirectory = layout.buildDirectory.dir('port-testing')
    from sourceSets.portRuntime.output
    from sourceSets.portCodec.output
    from sourceSets.portCodecTest.output
}

tasks.register('runForgePortTests', JavaExec) {
    dependsOn 'prepareRunServer', launcherJar, runtimeJar
    mainClass = 'cpw.mods.bootstraplauncher.BootstrapLauncher'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    workingDir file('run/port-tests')
    doFirst {
        workingDir.mkdirs()
        new File(workingDir, 'eula.txt').text = 'eula=true\n'
        def server = tasks.named('runServer').get()
        def config = minecraft.runs.server
        def tokens = new LinkedHashMap(config.tokens)
        config.lazyTokens.each { key, supplier -> tokens[key] = supplier.get() }
        def cp = new LinkedHashSet(server.minecraftArtifacts.files + server.runtimeClasspathArtifacts.files
                + configurations.portCodecTestRuntimeClasspath.files + configurations.portRuntimeRuntimeClasspath.files)
        cp.removeAll(sourceSets.main.output.files)
        def launcher = launcherJar.get().archiveFile.get().asFile
        def runtime = runtimeJar.get().archiveFile.get().asFile
        cp.add(launcher)
        setClasspath(project.files(cp))
        def vm = config.jvmArgs.collect { config.replace(tokens, it) }
        setJvmArgs(vm)
        config.properties.each { key, value ->
            if (key != 'legacyClassPath.file') systemProperty key, config.replace(tokens, value)
        }
        systemProperty 'legacyClassPath', cp*.absolutePath.join(File.pathSeparator)
        systemProperty 'java.awt.headless', 'true'
        systemProperty 'apple.awt.UIElement', 'true'
        systemProperty 'thaumaturge.portTestPaths', runtime.absolutePath
        systemProperty 'thaumaturge.portResults', layout.buildDirectory.dir('test-results/forgePortTest').get().asFile.absolutePath
        systemProperty 'thaumaturge.testResourceRoot', file('src/main/resources').absolutePath
        def tests = sourceSets.portCodecTest.output.classesDirs.asFileTree.matching {
            include '**/*Test.class'
            exclude '**/*$*'
        }.files.collect { f ->
            def root = sourceSets.portCodecTest.output.classesDirs.files.find { f.toPath().startsWith(it.toPath()) }
            root.toPath().relativize(f.toPath()).toString().replace(File.separator, '.').replaceAll(/\.class$/, '')
        }.sort()
        def testList = layout.buildDirectory.file('port-testing/test-classes.txt').get().asFile
        testList.text = tests.join('\n') + '\n'
        systemProperty 'thaumaturge.portTestClasses', testList.absolutePath
        environment.remove('MOD_CLASSES')
        environment 'MCP_MAPPINGS', config.replace(tokens, config.environment['MCP_MAPPINGS'])
        def launch = new ArrayList(config.args)
        launch[launch.indexOf('--launchTarget') + 1] = 'thaumaturgeporttests'
        int mixin = launch.indexOf('--mixin.config')
        if (mixin >= 0) { launch.remove(mixin + 1); launch.remove(mixin) }
        setArgs(launch)
    }
}

tasks.register('inspectForgePortLaunch') {
    dependsOn 'prepareRunServer'
    doLast {
        def server = tasks.named('runServer', JavaExec).get()
        def config = minecraft.runs.server
        def result = [main: server.mainClass.get(), args: server.args,
                      jvmArgs: server.allJvmArgs, classpath: server.classpath.files*.absolutePath,
                      environment: server.environment.findAll { key, value -> key in ['MOD_CLASSES', 'MCP_MAPPINGS'] },
                      configMain: config.main, configArgs: config.args, configJvmArgs: config.jvmArgs,
                      configProperties: config.properties, configEnvironment: config.environment,
                      configTokens: config.tokens,
                      lazyTokens: config.lazyTokens.collectEntries { key, supplier -> [(key): supplier.get()] }]
        def output = layout.buildDirectory.file('port-testing/server-launch.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result))
        println "Server launch settings written to ${output}"
    }
}
